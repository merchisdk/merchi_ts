name: Report verified upstream releases
description: Send completed release manifests to Merchi System Agent without executing downstream code.
inputs:
  manifest:
    description: Path to a JSON release manifest or array of verified release manifests.
    required: true
  release-token:
    description: Dedicated System Agent release-ingress credential.
    required: true
  endpoint:
    description: Exact System Agent release-ingress URL.
    default: https://system-agent.merchi.co/v1/repository-workflow/releases
runs:
  using: composite
  steps:
    - shell: bash
      env:
        REPORT_MANIFEST: ${{ inputs.manifest }}
        SYSTEM_AGENT_RELEASE_TOKEN: ${{ inputs.release-token }}
        SYSTEM_AGENT_RELEASE_URL: ${{ inputs.endpoint }}
      run: python3 -B "$GITHUB_ACTION_PATH/report_release.py" --manifest "$REPORT_MANIFEST"
