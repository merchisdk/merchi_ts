name: Publish changed packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test release orchestration
        run: pnpm release:test

      - name: Plan changed package releases
        id: plan
        run: node .github/scripts/release-plan.mjs --write

      - name: Build changed release manifests
        if: steps.plan.outputs.versioned == 'true'
        run: pnpm build

      - name: Typecheck workspace
        if: steps.plan.outputs.versioned == 'true'
        run: pnpm typecheck

      - name: Validate package contents
        if: steps.plan.outputs.versioned == 'true'
        run: node .github/scripts/publish-release.mjs --verify-only

      - name: Record release versions on main
        if: steps.plan.outputs.versioned == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages pnpm-lock.yaml
          git diff --cached --check
          git diff --cached --quiet || git commit -m "chore: release packages [skip ci]"
          # A concurrent merge rejects this push; never force-push main.
          git push origin HEAD:main

      - name: Publish in dependency order
        if: steps.plan.outputs.work == 'true'
        run: node .github/scripts/publish-release.mjs
