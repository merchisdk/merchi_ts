name: Release orchestration checks
on:
  pull_request:
    branches: [main]
    paths:
      - .github/**
jobs:
  release-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test .github/scripts/*.test.mjs
      - run: python3 -B -m unittest discover -s .github/actions/report-upstream-release -p 'test_*.py'
