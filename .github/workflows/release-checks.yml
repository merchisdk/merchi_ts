name: Release orchestration checks
on:
  pull_request:
    branches: [main]
    paths:
      - .github/**
      - packages/cart/**
      - packages/checkout/**
      - packages/error-catch-sdk/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
jobs:
  release-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test .github/scripts/*.test.mjs
      - run: python3 -B -m unittest discover -s .github/actions/report-upstream-release -p 'test_*.py'
      - name: Reproduce and verify the storefront reporter upgrade
        run: node .github/scripts/verify-storefront-reporter.mjs
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build --filter=@merchi/cart --filter=@merchi/checkout --filter=@merchi/error-catch
      - name: Verify candidate storefront reporting
        run: node .github/scripts/verify-storefront-reporter.mjs --candidate
